<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Buku Tamu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>

  <header>
    <p class="school">SMK 1 MALUKU TENGAH</p>
    <h1>🔐 Panel Admin</h1>
    <p class="sub">Kelola data buku tamu</p>
  </header>

  <main class="container">
    <!-- Login Form -->
    <div class="card" id="loginCard">
      <h2>Login Admin</h2>
      <input type="password" id="password" placeholder="Masukkan password admin" />
      <button id="btnLogin">Login</button>
      <small id="status"></small>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display:none">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
          <h2 style="margin:0;">Daftar Tamu</h2>
          <button id="btnLogout">Logout</button>
        </div>
        <div id="list" class="list"></div>
      </div>
    </div>
  </main>

  <footer>
    <small>© 2025 Buku Tamu Digital • <a href="/" style="color:#94a3b8; text-decoration:none;">← Buku Tamu</a></small>
  </footer>

  <script type="module">
    import { createClient } from 'https://esm.sh/@libsql/client@0.18.0/web';

    const db = createClient({
      url: 'libsql://buku-tamu-linomof01-lab.aws-ap-northeast-1.turso.io',
      authToken: 'GANTI_TOKEN_TURSO_DISINI'
    });

    const ADMIN_PASSWORD = 'admin123';
    const STORAGE_KEY = 'bukuTamuAdmin';

    const $ = id => document.getElementById(id);

    function isLoggedIn() {
      return sessionStorage.getItem(STORAGE_KEY) === 'yes';
    }

    function showLogin() {
      $('loginCard').style.display = 'block';
      $('adminPanel').style.display = 'none';
    }

    function showAdmin() {
      $('loginCard').style.display = 'none';
      $('adminPanel').style.display = 'block';
      loadList();
    }

    // Login
    $('btnLogin').addEventListener('click', () => {
      const password = $('password').value;
      const status = $('status');
      if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, 'yes');
        $('password').value = '';
        status.textContent = '';
        showAdmin();
      } else {
        status.style.color = '#f87171';
        status.textContent = '❌ Password salah!';
      }
    });

    // Enter untuk login
    $('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') $('btnLogin').click();
    });

    // Logout
    $('btnLogout').addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      showLogin();
    });

    // Load list
    async function loadList() {
      try {
        const res = await db.execute('SELECT * FROM tamu ORDER BY id DESC');
        const data = res.rows;
        const list = $('list');
        if (!data.length) {
          list.innerHTML = '<p class="empty">Belum ada tamu.</p>';
          return;
        }
        list.innerHTML = data.map(t => `
          <div class="entry">
            <div class="head">
              <div>
                <b>${esc(t.nama)}</b>
                ${t.asal ? `<span class="asal"> • ${esc(t.asal)}</span>` : ''}
              </div>
              <div>
                <small>${relatif(t.waktu)}</small>
                <button class="del" onclick="hapus(${t.id})" title="Hapus">✕</button>
              </div>
            </div>
            <p>${esc(t.pesan)}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        $('list').innerHTML = '<p class="empty">❌ Gagal memuat data.</p>';
      }
    }

    // Hapus (global biar bisa dipanggil dari onclick)
    window.hapus = async function(id) {
      if (!confirm('Hapus data tamu ini?')) return;
      try {
        await db.execute({
          sql: 'DELETE FROM tamu WHERE id = ?',
          args: [id]
        });
        loadList();
      } catch (err) {
        console.error(err);
        alert('Gagal menghapus data.');
      }
    };

    // Helper
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
      ));
    }

    function relatif(tgl) {
      const d = new Date(tgl.replace(' ', 'T') + 'Z');
      const s = Math.floor((Date.now() - d) / 1000);
      if (s < 60) return 'baru saja';
      if (s < 3600) return Math.floor(s / 60) + ' menit lalu';
      if (s < 86400) return Math.floor(s / 3600) + ' jam lalu';
      if (s < 604800) return Math.floor(s / 86400) + ' hari lalu';
      return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
    }

    // Init
    if (isLoggedIn()) showAdmin();
    else showLogin();
  </script>
</body>
</html>
